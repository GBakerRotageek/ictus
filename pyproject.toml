[project]
name = "ictus"
version = "0.0.0"
description = "Typed composition, validation and linting for multi-stage agent pipelines"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "ruamel.yaml>=0.18", "typer>=0.15"]

[project.scripts]
ictus = "ictus.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["mypy>=1.13", "ruff>=0.8", "pytest>=8.3"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "TCH", "ARG", "PTH", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = true
enable_error_code = ["redundant-expr", "possibly-undefined", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
