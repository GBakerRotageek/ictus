workflow:
  name: Smoke Test Pipeline
  description: Ticket plan -> breakdown -> review gate -> execute -> test -> 
    finish
  version: '1'
  entry_point: plan
agents:
- name: Plan
  task_id: plan
  type: agent
  config: {}
  next_task_id: breakdown
- name: Breakdown
  task_id: breakdown
  type: agent
  config: {}
  next_task_id: review_gate
- name: Review Gate
  task_id: review_gate
  type: agent
  config: {}
  transitions:
    rejected: breakdown
    approved: execution
- name: Execution
  task_id: execution
  type: agent
  config: {}
  next_task_id: testing
- name: Testing
  task_id: testing
  type: agent
  config: {}
  next_task_id: finish
- name: Finish
  task_id: finish
  type: agent
  config: {}
