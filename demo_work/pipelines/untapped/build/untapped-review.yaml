      - workflow.input.intent?
      - voices.outputs.engine.position?
      - voices.outputs.engine.concerns?
      - voices.outputs.field.position?
      - voices.outputs.field.concerns?
      - voices.outputs.operator.position?
      - voices.outputs.operator.concerns?
      - report.output.text?
      - verify.output.corrections?
      - interject.output.additional_input.notes?
    output:
      satisfied:
        type: boolean
        description: 'Nothing left to change re: where the engine is extensible rather than merely featureful, and what this library could build on those seams instead of beside them'
      position:
        type: string
        description: Where this voice stands, in a sentence
      concerns:
        type: string
        description: What to change, one per line
      unchecked:
        type: string
        description: What this voice could not verify, and what blocked it
  - name: report
    description: Synthesise the round
    type: agent
    prompt: |
      Several voices have just assessed the same material, each watching for something different. Write one report of where this round got to.

      Do not average them. Where they disagree, say who disagrees with whom and about what — a disagreement recorded as a disagreement is useful, and one smoothed into consensus is a decision made by omission. Where a concern from one voice would be answered by another's suggestion, say so.

      Put anything still contested in `dissent`, naming the voices. Leave it empty only when nothing is.

      Each voice also reports what it could not check. Collect all of it into `unverified`, naming the voice and what blocked it. This is the one part of the report you must not tidy away: a finding that rests on a lookup nobody managed to perform is not a finding, and it must be visible as such rather than written up in the same voice as a checked one. Where a voice put a claim in `concerns` that its own `unchecked` shows it could not verify, say so in `unverified` rather than repeating the claim.

