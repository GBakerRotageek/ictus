    input:
      - engine.output.remark
      - engine.output.agree
      - study.outputs.engine_study.opening?
      - field.output.remark
      - field.output.agree
      - study.outputs.field_study.opening?
      - operator.output.remark
      - operator.output.agree
      - study.outputs.operator_study.opening?
      - extension.output.remark
      - extension.output.agree
      - study.outputs.extension_study.opening?
      - round_number.output
      - interject.output.selected?
    output:
      text:
        type: string
        description: What the table concluded
      dissent:
        type: string
        description: What is still contested, and by whom
      unverified:
        type: string
        description: Claims nobody at the table could confirm
    routes:
      - to: halted
        when: "{{ interject.output.selected == 'stop' }}"
      - to: agreed
        when: '{{ engine.output.agree and field.output.agree and operator.output.agree and extension.output.agree }}'
      - to: unresolved
  - name: agreed
    type: terminate
    status: success
    reason: The table agreed
    output_template:
      outcome: agreed
      minutes: '{{ minutes.output.text }}'
      dissent: '{{ minutes.output.dissent }}'
      unverified: '{{ minutes.output.unverified }}'
      rounds: '{{ round_number.output }}'
    input:
      - minutes.output.text
      - minutes.output.dissent
      - minutes.output.unverified
      - round_number.output
  - name: unresolved
    type: terminate
    status: success
    reason: Still contested after 3 round(s)
    output_template:
      outcome: unresolved
      minutes: '{{ minutes.output.text }}'
      dissent: '{{ minutes.output.dissent }}'
      unverified: '{{ minutes.output.unverified }}'
      rounds: '{{ round_number.output }}'
    input:
      - minutes.output.text
      - minutes.output.dissent
      - minutes.output.unverified
      - round_number.output
  - name: interject
    description: Read the round and steer it
    type: human_gate
    prompt: |
      Round {{ round_number.output }} of 3.

      **Where it stands**

      - `engine` would stop here: {{ engine.output.agree }}
      - `field` would stop here: {{ field.output.agree }}
      - `operator` would stop here: {{ operator.output.agree }}
      - `extension` would stop here: {{ extension.output.agree }}

      Carrying on hands it back to the table, which finishes when everyone would stop, or runs another round — up to 3.

      --- the last thing each person said ---

      **engine**:
      {{ engine.output.remark }}

      **field**:
      {{ field.output.remark }}

      **operator**:
      {{ operator.output.remark }}

      **extension**:
      {{ extension.output.remark }}
    input:
      - engine.output.remark
      - engine.output.agree
      - field.output.remark
      - field.output.agree
      - operator.output.remark
      - operator.output.agree
      - extension.output.remark
      - extension.output.agree
      - round_number.output
    options:
      - label: Hand it back to the table
        value: continue
        route: tallied
      - label: Hand it back, with direction they must follow
        value: steer
        route: tallied
        prompt_for: notes
        multiline: true
      - label: Stop here and write it up
        value: stop
        route: minutes
  - name: tallied
    description: Where the round left it
    type: set
    value: continue
    output_type: string
    input:
      - interject.output.selected
      - round_number.output
      - engine.output.agree
      - field.output.agree
      - operator.output.agree
      - extension.output.agree
    routes:
      - to: minutes
        when: '{{ engine.output.agree and field.output.agree and operator.output.agree and extension.output.agree }}'
      - to: minutes
        when: '{{ round_number.output | int >= 3 }}'
      - to: round_number
  - name: halted
    type: terminate
    status: success
    reason: Stopped by the person overseeing the table
    output_template:
      outcome: halted
      minutes: '{{ minutes.output.text }}'
      dissent: '{{ minutes.output.dissent }}'
      unverified: ''
      rounds: '{{ round_number.output }}'
    input:
      - minutes.output.text
      - minutes.output.dissent
      - round_number.output
