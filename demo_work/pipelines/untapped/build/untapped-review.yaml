      --- engine (machinery the installed engine already has that no pipeline here can ask for — lifecycle, recovery, concurrency, the shapes a workflow may take) ---
      position: {{ voices.outputs.engine.position }}
      concerns:
      {{ voices.outputs.engine.concerns }}
      could not check:
      {{ voices.outputs.engine.unchecked }}

      --- field (what the project has shipped, announced or been asked for beyond the installed version, and which of it would change what this library can do) ---
      position: {{ voices.outputs.field.position }}
      concerns:
      {{ voices.outputs.field.concerns }}
      could not check:
      {{ voices.outputs.field.unchecked }}

      --- operator (what a person driving the engine directly can do that this library's command line does not let them do) ---
      position: {{ voices.outputs.operator.position }}
      concerns:
      {{ voices.outputs.operator.concerns }}
      could not check:
      {{ voices.outputs.operator.unchecked }}

      --- extension (where the engine is extensible rather than merely featureful, and what this library could build on those seams instead of beside them) ---
      position: {{ voices.outputs.extension.position }}
      concerns:
      {{ voices.outputs.extension.concerns }}
      could not check:
      {{ voices.outputs.extension.unchecked }}
