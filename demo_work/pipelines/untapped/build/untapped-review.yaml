    max_agent_iterations: 200
    session_key: untapped-review-verify
    input:
      - report.output.text
      - report.output.dissent
      - report.output.unverified
    output:
      corrections:
        type: string
        description: Claims that did not survive
      sound:
        type: boolean
        description: Whether it holds up
    routes:
      - to: interject
  - name: agreed
    type: terminate
    status: success
    reason: Every voice is satisfied
    output_template:
      outcome: agreed
      report: '{{ report.output.text }}'
      dissent: '{{ report.output.dissent }}'
      unverified: '{{ report.output.unverified }}'
      rounds: '{{ round_number.output }}'
      corrections: '{{ verify.output.corrections }}'
    input:
      - report.output.text
      - report.output.dissent
      - report.output.unverified
      - round_number.output
      - verify.output.corrections
  - name: unresolved
    type: terminate
    status: success
    reason: Still contested after 3 round(s)
    output_template:
      outcome: unresolved
      report: '{{ report.output.text }}'
      dissent: '{{ report.output.dissent }}'
      unverified: '{{ report.output.unverified }}'
      rounds: '{{ round_number.output }}'
      corrections: '{{ verify.output.corrections }}'
    input:
      - report.output.text
      - report.output.dissent
      - report.output.unverified
      - round_number.output
      - verify.output.corrections
  - name: interject
    description: Read this round and steer it
    type: human_gate
    prompt: |-
      Round {{ round_number.output }} of 3.

      **Where it stands**

      - `engine` satisfied: {{ voices.outputs.engine.satisfied }}
      - `field` satisfied: {{ voices.outputs.field.satisfied }}
      - `operator` satisfied: {{ voices.outputs.operator.satisfied }}
      - `extension` satisfied: {{ voices.outputs.extension.satisfied }}
      - report survived checking: {{ verify.output.sound }}

      Choosing to carry on hands it back to the council, which then finishes if every voice is satisfied and the report survived checking, or runs another round — up to 3.

      {{ report.output.text }}

      --- still contested ---
      {{ report.output.dissent }}

      --- what did not survive checking ---
      {{ verify.output.corrections }}
    input:
      - verify.output.corrections
      - report.output.text
      - report.output.dissent
      - round_number.output
      - voices.outputs.engine.satisfied
      - voices.outputs.field.satisfied
      - voices.outputs.operator.satisfied
      - voices.outputs.extension.satisfied
      - verify.output.sound
    options:
      - label: Hand it back to the council
        value: continue
        route: tallied
      - label: Hand it back, with direction they must follow
        value: steer
        route: tallied
        prompt_for: notes
        multiline: true
      - label: Stop now and take this report as it is
        value: stop
        route: halted
  - name: halted
    type: terminate
    status: success
    reason: Stopped by the person overseeing the council
    output_template:
      outcome: halted
      report: '{{ report.output.text }}'
      dissent: '{{ report.output.dissent }}'
      unverified: '{{ report.output.unverified }}'
      rounds: '{{ round_number.output }}'
      corrections: '{{ verify.output.corrections }}'
    input:
      - report.output.text
      - report.output.dissent
      - report.output.unverified
      - round_number.output
      - verify.output.corrections
  - name: tallied
    description: Decide whether the council is finished
    type: set
    value: continuing
    output_type: string
    input:
      - interject.output.selected
      - round_number.output
      - voices.outputs.engine.satisfied
      - voices.outputs.field.satisfied
      - voices.outputs.operator.satisfied
      - voices.outputs.extension.satisfied
      - verify.output.sound
    routes:
      - to: agreed
        when: '{{ voices.outputs.engine.satisfied and voices.outputs.field.satisfied and voices.outputs.operator.satisfied and voices.outputs.extension.satisfied and verify.output.sound }}'
      - to: unresolved
        when: '{{ round_number.output | int >= 3 }}'
      - to: round_number
parallel:
  - name: voices
    agents:
      - engine
      - field
      - operator
      - extension
    failure_mode: fail_fast
    description: 4 voices, at once
    routes:
      - to: report
