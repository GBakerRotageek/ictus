  - name: minutes
    description: Write up what the table concluded
    type: agent
    prompt: |
      A group of people have just finished talking something through. Write up what they concluded.

      You were not in the room and you are not a participant: report the discussion, do not continue it. Where they agreed, say what they agreed and on whose argument. Where they did not, put it in `dissent` naming who holds what — a disagreement recorded as a disagreement is useful, and one smoothed into consensus is a decision made by omission.

