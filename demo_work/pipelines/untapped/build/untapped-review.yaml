    input:
      - voices.outputs.engine.position
      - voices.outputs.engine.concerns
      - voices.outputs.engine.unchecked
      - voices.outputs.engine.satisfied
      - voices.outputs.field.position
      - voices.outputs.field.concerns
      - voices.outputs.field.unchecked
      - voices.outputs.field.satisfied
      - voices.outputs.operator.position
      - voices.outputs.operator.concerns
      - voices.outputs.operator.unchecked
      - voices.outputs.operator.satisfied
      - voices.outputs.extension.position
      - voices.outputs.extension.concerns
      - voices.outputs.extension.unchecked
      - voices.outputs.extension.satisfied
      - round_number.output
    output:
      text:
        type: string
        description: The round's report
      dissent:
        type: string
        description: What is still contested, and by whom
      unverified:
        type: string
        description: Claims resting on something nobody could check
    routes:
      - to: verify
  - name: verify
    description: Check the report against the thing itself
    type: agent
    prompt: |-
      You are checking a brainstorm about an engine that is installed on this machine and readable. Two failure modes matter more than the rest, and both produce claims that read perfectly well.

      First: the wrong product. The engine here is `conductor-cli` from github.com/microsoft/conductor, built on the GitHub Copilot SDK. Several unrelated products are also called Conductor — Netflix's workflow engine most prominently. A capability that turns out to belong to one of those is not a finding, it is a different tool. Anything sourced from the web needs checking against the installed package before it survives.

      Second: already done. A capability this library reaches today is not untapped. Check `src/ictus/` before agreeing that something is unused — `interfaces/conductor/` is where every engine-facing field is emitted, and `lints.py` keeps three tables saying which fields are wired and which are deliberately refused.

      For anything that survives both, say whether the provider this project actually runs would honour it. A capability the chosen provider ignores is worth knowing about and is not worth wiring.

      You are checking a report several people wrote after discussing something. Your job is to refute it, not to improve it. They may have read a summary rather than the thing itself, and agreement between them is no evidence at all — four people who read the same wrong page agree sooner, not later.

      Take every claim about how something behaves and check it against the thing itself. In `corrections`, list what does not survive: quote the claim, say what is actually the case, and cite where you looked. Say plainly when a claim is right — a correction list that strikes out everything is as useless as one that strikes out nothing.

      Set `sound` to true only if nothing material was wrong. A report whose central point rests on a claim you refuted is not sound, however well argued.

      Start with what they could not check. That list is where the unfounded claims are, and a lookup one voice failed at is usually one you can complete — a command run against the wrong path or the wrong interpreter fails in a way that looks identical to the thing being absent. Go and complete it. If several voices were stopped by the same obstacle, treat every conclusion downstream of it as unfounded until you have checked it yourself, however many of them agreed.

      --- the report ---
      {{ report.output.text }}

      --- what they still contest ---
      {{ report.output.dissent }}

      --- what they could not check ---
      {{ report.output.unverified }}
