      Sort what you find by what it would cost to take up: a field to emit, a command to wrap, a stdlib constructor to write, a change upstream, or a decision nobody has made. Say plainly which items are *deliberately* not taken up rather than merely unused — a wrapper that exposed everything underneath it would be a worse tool than one that chose.

