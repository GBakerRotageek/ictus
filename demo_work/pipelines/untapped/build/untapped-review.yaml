      Say what changed during the conversation. A position somebody arrived with and abandoned, and why, is usually the most informative thing that happened, and it is the part a transcript buries.

      Sort what the table settled on by what it would cost to take up: a field to emit, a command to wrap, a stdlib constructor to write, a change upstream, or a decision nobody has made. Say plainly which items are *deliberately* not taken up rather than merely unused — a wrapper that exposed everything underneath it would be a worse tool than one that chose.

      Where a capability is real but the provider this project runs ignores it, keep it and mark it: that is a finding about the roadmap, not about today.

      --- what each person came in with, before anybody spoke ---

      **engine** opened with:
      {{ study.outputs.engine_study.opening }}

      **field** opened with:
      {{ study.outputs.field_study.opening }}

      **operator** opened with:
      {{ study.outputs.operator_study.opening }}

      **extension** opened with:
      {{ study.outputs.extension_study.opening }}

      These were formed independently. Compare them with where each person ended: who moved, and on whose argument. A table whose openings differed and whose ending does not is either a conversation that worked or a first speaker who framed it and three people who followed — and those look identical in the final positions, which is why you are being handed both. If you cannot point to the argument that moved somebody, say so rather than crediting agreement.

      --- the last thing each person said ---

      **engine**:
      {{ engine.output.remark }}

      **field**:
      {{ field.output.remark }}

      **operator**:
      {{ operator.output.remark }}

      **extension**:
      {{ extension.output.remark }}
