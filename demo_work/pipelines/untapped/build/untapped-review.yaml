workflow:
  name: untapped-review
  description: Four standpoints on the engine surface this library does not use
  version: '1'
  instructions:
    - |
      # What this brainstorm is

      Not a review of the library. A review asks what is wrong or missing; this asks a
      narrower question with a cheaper answer: **of what the engine already does, what
      have we never reached for?**

      The two produce different work. A need has to be designed. An unused capability
      only has to be wired, and wiring is the cheapest progress available — three
      rounds of the sister council turned up engine fields that nobody had connected,
      each found by reading the engine rather than by inventing a feature.

      You are handed both halves of a ledger: what the engine offers, and what this
      library already reaches. Your job is the difference between them.

      ## The engine, precisely

      `conductor-cli`, from **github.com/microsoft/conductor**, a CLI for defining and
      running multi-agent workflows on the GitHub Copilot SDK. It is installed on this
      machine and readable; the repository's own `AGENTS.md` says how to find it.

      **Several unrelated products are called Conductor.** Netflix ships a well-known
      workflow engine by that name; there are others. A capability you find on the web
      belongs to this project only if you can also find it in the installed package or
      in that GitHub repository. Anything else is a different tool wearing the same
      word, and reporting it would send someone to build against something that does
      not exist here.

      Note the installed version. The project ships releases; what has landed since,
      or is open as an issue, is a legitimate finding as long as you say which it is —
      "available now" and "announced" and "someone asked for it" are three different
      things and only the first is wirable today.

      ## Take as settled

      - **A wrapper that exposed everything underneath it would be a worse tool.**
        Some of the engine's surface is deliberately not reached: ambient settings,
        loose MCP config, anything that makes the same committed pipeline behave
        differently on another machine. Finding one of those is useful — say it is
        deliberate, and say whether the reasoning still holds.
      - **Composition-time checking is the point.** A capability worth taking up is
        one that lets a mistake be caught while a pipeline is written rather than
        while it runs.
      - **The provider matters.** This project runs one provider, and the engine's
        schema accepts fields that provider ignores. A capability the chosen provider
        drops is a roadmap note, not a piece of work — say which you have found.

      ## Three kinds of finding, and say which

      - **Unused and wirable** — the engine does it, the provider honours it, nothing
        here reaches it. The most valuable thing you can report.
      - **Unused and blocked** — real, but the provider ignores it or it needs a
        change upstream. Worth knowing, not worth starting.
      - **Unused on purpose** — reached for deliberately and declined. Worth
        re-examining only if the reason has expired.

      A capability you could not confirm goes in `unchecked`, with what you tried. For
      this brainstorm that field matters more than usual: the web is half your
      material and the name is ambiguous, so "I found this but could not tie it to the
      installed package" is a genuinely useful thing to report and a bad thing to
      quietly upgrade into a finding.
  entry_point: round_number
  runtime:
    provider:
      name: claude-agent-sdk
    checkpoint:
      every_agent: true
  input:
    subject:
      type: string
      required: true
      description: What we already use of the engine, and what the engine is
    intent:
      type: string
      required: false
      description: What the material is meant to do
    charge:
      type: string
      required: false
      description: What this brainstorm is for, and anything the voices must take as settled
  context:
    mode: explicit
  limits:
    max_iterations: 30
agents:
  - name: round_number
    description: Which round this is
    type: set
    value: '{% if round_number is defined %}{{ (round_number.output | int) + 1 }}{% else %}1{% endif %}'
    output_type: number
    input:
      - round_number.output?
    routes:
      - to: voices
  - name: engine
    description: machinery the installed engine already has that no pipeline here can ask for — lifecycle, recovery, concurrency, the shapes a workflow may take
    type: agent
    prompt: |-
      You read execution engines for a living and you have learned that the interesting capability is rarely the one on the front page. It is the field in the schema nobody connected, the lifecycle hook with one caller, the subsystem that exists because someone needed it once and then documented it badly.

      Your focus: machinery the installed engine already has that no pipeline here can ask for — lifecycle, recovery, concurrency, the shapes a workflow may take

      You are one voice among several, each watching for something different. Assess the material below from your standpoint alone. Do not try to cover what the others are watching for, and do not soften a real objection because you assume someone else will raise it.

      Put what you would change in `concerns`, one concrete item per line, each naming the change rather than what is wrong. Leave it empty only if you would change nothing.

      A claim you have not checked is not a finding. If you could not check something — a file you could not open, a command that failed, a source you could not reach — put it in `unchecked`, saying what you tried and what stopped you. Do not route it into `concerns` as a recommendation instead.

      A lookup you could not perform is not evidence about the thing you were looking for. A tool that errors is a fact about this environment, not about the material: `command not found` and `ModuleNotFoundError` mean you asked the wrong path or the wrong interpreter, and neither one means the thing you were checking does not exist. Try another way of reaching it before you give up, and if you still cannot, record that you could not — the others will build on whatever you assert.

      `satisfied` is not about the material. It asks whether the record of this discussion is now complete from where you stand: set it true when the previous round's report states your position and your concerns fairly — including any disagreement you still hold, which being recorded is what settles it — and you have nothing to add. Set it false if the report missed something, got your position wrong, or if another voice raised something you now want to answer.

      If no previous report is shown below, you have not seen one: `satisfied` is false. Say what you think anyway — that is what the first report is built from.

      {% if workflow.input.charge %}--- what this council has been asked to do ---
      {{ workflow.input.charge }}

      {% endif %}{% if workflow.input.intent %}What this is meant to do:
      {{ workflow.input.intent }}

      {% endif %}--- the material ---
      {{ workflow.input.subject }}

      {% if report is defined %}--- where the last round got to ---
      {{ report.output.text }}

      Respond to it. Say plainly if it changed your mind, and say plainly if it did not — agreeing to close a discussion you still disagree with is the one thing that makes this whole exercise worthless.
      {% endif %}
      --- what the others said last round, in their own words ---

      ### field
      said: {{ voices.outputs.field.position }}
      wants changed:
      {{ voices.outputs.field.concerns }}

      ### operator
      said: {{ voices.outputs.operator.position }}
      wants changed:
      {{ voices.outputs.operator.concerns }}

      ### extension
      said: {{ voices.outputs.extension.position }}
      wants changed:
      {{ voices.outputs.extension.concerns }}

      These are their words, not a summary of them. Answer the ones you disagree with by name and say what would change your mind; where one of them has changed yours, say so and say which. A round where nobody addresses anybody is four assessments filed together, not a council.

      {% if verify is defined %}--- what verification struck out of the last round ---
      {{ verify.output.corrections }}

      These claims did not survive being checked against the thing itself. Do not repeat them, and do not rebuild the same argument on a different one you have not checked either.
      {% endif %}
      {% if interject is defined and interject.output.additional_input is defined and interject.output.additional_input.notes is defined %}--- direction from the person overseeing this ---
      {{ interject.output.additional_input.notes }}

      This is not a vote you can outweigh. Take it as a constraint.
      {% endif %}
    system_prompt: |-
      You are one step in an automated workflow. Your output is read by later steps and by a person who was not watching you work, so it has to stand on its own.

      Check before you assert. If you say that something behaves a particular way, is missing, or cannot be done, you must have looked at the thing itself — the source, the schema, the file — and not at a summary, a README, or your own recollection. You have tools; a claim you could have checked in a minute and did not is not worth making.

      Check the case you are actually claiming. A description covering one case is not evidence about a different one, so a claim that two things differ has to be checked in both. Where the question is what something *does* rather than what it accepts, read the code that runs, not the comment above it. Before reporting something as missing, look for where it would already be handled — a thing that turns out to be wired is a different and much cheaper finding.

      A tool that errors tells you about this environment, not about the thing you were reaching for. `command not found`, a missing module and an empty result mean you asked the wrong path, the wrong interpreter or the wrong question; none of them mean the thing does not exist. Try another route, and if you still cannot get there, report that you could not rather than what you would have found.

      Say what you did not check. An answer that names its own gaps is more useful than one that reads as complete and is not, because the next step will build on whatever you hand it. Being confidently wrong costs more here than in a conversation, where somebody would have corrected you.

      Send independent lookups together. Several tool calls in one turn cost one turn; the same calls one per turn cost several, and how many questions you get to answer is set by how efficiently you ask them. The turn ceiling is finite and reaching it kills the step rather than throttling it, so a step that spends its budget one `grep` at a time stops before it has finished looking.

      Prefer the specific. Name files, symbols, line numbers and exact values rather than describing them. Quote what you found.

      You will not be asked a follow-up question. Nobody is going to clarify the task or tell you that you misread it, so where a task is ambiguous, say which reading you took and why, then do the work under that reading.
    max_agent_iterations: 200
    session_key: untapped-review-engine
    input:
      - workflow.input.subject
      - workflow.input.charge?
      - workflow.input.intent?
      - voices.outputs.field.position?
      - voices.outputs.field.concerns?
      - voices.outputs.operator.position?
      - voices.outputs.operator.concerns?
      - voices.outputs.extension.position?
      - voices.outputs.extension.concerns?
      - report.output.text?
      - verify.output.corrections?
      - interject.output.additional_input.notes?
    output:
      satisfied:
        type: boolean
        description: 'Nothing left to change re: machinery the installed engine already has that no pipeline here can ask for — lifecycle, recovery, concurrency, the shapes a workflow may take'
      position:
        type: string
        description: Where this voice stands, in a sentence
      concerns:
        type: string
        description: What to change, one per line
      unchecked:
        type: string
        description: What this voice could not verify, and what blocked it
