      Prefer the specific. Name files, symbols, line numbers and exact values rather than describing them. Quote what you found.

      You will not be asked a follow-up question. Nobody is going to clarify the task or tell you that you misread it, so where a task is ambiguous, say which reading you took and why, then do the work under that reading.
    input:
      - plan.output.plan
      - execution.output.results
    output:
      report:
        type: string
        description: Pass/fail report
    routes:
      - to: finish
  - name: finish
    description: Ticket complete
    type: terminate
    status: success
    reason: Breakdown approved, executed and tested.
    output_template:
      report: '{{ testing.output.report }}'
    input:
      - testing.output.report
  - name: confirm_start
    description: Confirm before anything runs
    type: human_gate
    prompt: |
      Start **smoke-test**?

      Plan a ticket, break it down, gate it on a human, execute and test.

      7 step(s) on one pass, up to 11 with loops, beginning with `locate`.

      ---

      **ticket**

      ```
      {{ workflow.input.ticket }}
      ```
    input:
      - workflow.input.ticket
    options:
      - label: Start the run
        value: start
        route: locate
      - label: Stop — do not run
        value: cancel
        route: not_started
  - name: not_started
    type: terminate
    status: success
    reason: Stopped at the start gate; nothing was run.
    output_template:
      started: 'false'
output:
  report: '{{ testing.output.report | tojson }}'
