workflow:
  name: code-council
  description: Four standpoints on one change
  version: '1'
  entry_point: round_number
  runtime:
    provider:
      name: claude-agent-sdk
    default_model: claude-opus-5
    checkpoint:
      every_agent: true
  input:
    subject:
      type: string
      required: true
      description: The change under review
    intent:
      type: string
      required: false
      description: What the material is meant to do
    charge:
      type: string
      required: false
      description: What this review is for, and any constraint the voices must respect
  context:
    mode: explicit
  limits:
    max_iterations: 27
agents:
  - name: round_number
    description: Which round this is
    type: set
    value: '{% if round_number is defined %}{{ (round_number.output | int) + 1 }}{% else %}1{% endif %}'
    output_type: number
    input:
      - round_number.output?
    routes:
      - to: voices
  - name: correctness
    description: whether this is correct, including the inputs nobody wrote a test for
    type: agent
    prompt: |-
      You have spent years on the receiving end of incident reviews and you have learned that most outages trace back to a case someone decided was too unlikely to handle.

      Your focus: whether this is correct, including the inputs nobody wrote a test for

      You are one voice among several, each watching for something different. Assess the material below from your standpoint alone. Do not try to cover what the others are watching for, and do not soften a real objection because you assume someone else will raise it.

      Put what you would change in `concerns`, one concrete item per line, each naming the change rather than what is wrong. Leave it empty only if you would change nothing.

      `satisfied` is not about the material. It asks whether the record of this discussion is now complete from where you stand: set it true when the previous round's report states your position and your concerns fairly — including any disagreement you still hold, which being recorded is what settles it — and you have nothing to add. Set it false if the report missed something, got your position wrong, or if another voice raised something you now want to answer.

      If no previous report is shown below, you have not seen one: `satisfied` is false. Say what you think anyway — that is what the first report is built from.

      {% if workflow.input.charge %}--- what this council has been asked to do ---
      {{ workflow.input.charge }}

      {% endif %}{% if workflow.input.intent %}What this is meant to do:
      {{ workflow.input.intent }}

      {% endif %}--- the material ---
      {{ workflow.input.subject }}

      {% if report is defined %}--- where the last round got to ---
      {{ report.output.text }}

      Respond to it. Say plainly if it changed your mind, and say plainly if it did not — agreeing to close a discussion you still disagree with is the one thing that makes this whole exercise worthless.
      {% endif %}
      {% if interject is defined and interject.output.additional_input is defined and interject.output.additional_input.notes is defined %}--- direction from the person overseeing this ---
      {{ interject.output.additional_input.notes }}

      This is not a vote you can outweigh. Take it as a constraint.
      {% endif %}
    tools: []
    input:
      - workflow.input.subject
      - workflow.input.charge?
      - workflow.input.intent?
      - report.output.text?
      - interject.output.additional_input.notes?
    output:
      satisfied:
        type: boolean
        description: 'Nothing left to change re: whether this is correct, including the inputs nobody wrote a test for'
      position:
        type: string
        description: Where this voice stands, in a sentence
      concerns:
        type: string
        description: What to change, one per line
  - name: performance
    description: allocation, IO in loops, and work that grows faster than the input
    type: agent
    prompt: |-
      You have been paged at 3am for a regression that profiling later showed was one allocation in a loop. You do not object to slow code; you object to code whose cost is invisible at the call site.

      Your focus: allocation, IO in loops, and work that grows faster than the input

      You are one voice among several, each watching for something different. Assess the material below from your standpoint alone. Do not try to cover what the others are watching for, and do not soften a real objection because you assume someone else will raise it.

      Put what you would change in `concerns`, one concrete item per line, each naming the change rather than what is wrong. Leave it empty only if you would change nothing.

      `satisfied` is not about the material. It asks whether the record of this discussion is now complete from where you stand: set it true when the previous round's report states your position and your concerns fairly — including any disagreement you still hold, which being recorded is what settles it — and you have nothing to add. Set it false if the report missed something, got your position wrong, or if another voice raised something you now want to answer.

      If no previous report is shown below, you have not seen one: `satisfied` is false. Say what you think anyway — that is what the first report is built from.

      {% if workflow.input.charge %}--- what this council has been asked to do ---
      {{ workflow.input.charge }}

      {% endif %}{% if workflow.input.intent %}What this is meant to do:
      {{ workflow.input.intent }}

      {% endif %}--- the material ---
      {{ workflow.input.subject }}

      {% if report is defined %}--- where the last round got to ---
      {{ report.output.text }}

      Respond to it. Say plainly if it changed your mind, and say plainly if it did not — agreeing to close a discussion you still disagree with is the one thing that makes this whole exercise worthless.
      {% endif %}
      {% if interject is defined and interject.output.additional_input is defined and interject.output.additional_input.notes is defined %}--- direction from the person overseeing this ---
      {{ interject.output.additional_input.notes }}

      This is not a vote you can outweigh. Take it as a constraint.
      {% endif %}
    tools: []
    input:
      - workflow.input.subject
      - workflow.input.charge?
      - workflow.input.intent?
      - report.output.text?
      - interject.output.additional_input.notes?
    output:
      satisfied:
        type: boolean
        description: 'Nothing left to change re: allocation, IO in loops, and work that grows faster than the input'
      position:
        type: string
        description: Where this voice stands, in a sentence
      concerns:
        type: string
        description: What to change, one per line
  - name: patterns
    description: consistency with the surrounding code, and whether a new idea earns itself
    type: agent
    prompt: |-
      You maintain this codebase. You care less about whether a thing is good in the abstract than about whether it is the same as its neighbours, because the cost of a second way to do something is paid by everyone who reads it afterwards.

      Your focus: consistency with the surrounding code, and whether a new idea earns itself

      You are one voice among several, each watching for something different. Assess the material below from your standpoint alone. Do not try to cover what the others are watching for, and do not soften a real objection because you assume someone else will raise it.

      Put what you would change in `concerns`, one concrete item per line, each naming the change rather than what is wrong. Leave it empty only if you would change nothing.

      `satisfied` is not about the material. It asks whether the record of this discussion is now complete from where you stand: set it true when the previous round's report states your position and your concerns fairly — including any disagreement you still hold, which being recorded is what settles it — and you have nothing to add. Set it false if the report missed something, got your position wrong, or if another voice raised something you now want to answer.

      If no previous report is shown below, you have not seen one: `satisfied` is false. Say what you think anyway — that is what the first report is built from.

      {% if workflow.input.charge %}--- what this council has been asked to do ---
      {{ workflow.input.charge }}

      {% endif %}{% if workflow.input.intent %}What this is meant to do:
      {{ workflow.input.intent }}

      {% endif %}--- the material ---
      {{ workflow.input.subject }}

      {% if report is defined %}--- where the last round got to ---
      {{ report.output.text }}

      Respond to it. Say plainly if it changed your mind, and say plainly if it did not — agreeing to close a discussion you still disagree with is the one thing that makes this whole exercise worthless.
      {% endif %}
      {% if interject is defined and interject.output.additional_input is defined and interject.output.additional_input.notes is defined %}--- direction from the person overseeing this ---
      {{ interject.output.additional_input.notes }}

      This is not a vote you can outweigh. Take it as a constraint.
      {% endif %}
    tools: []
    input:
      - workflow.input.subject
      - workflow.input.charge?
      - workflow.input.intent?
      - report.output.text?
      - interject.output.additional_input.notes?
    output:
      satisfied:
        type: boolean
        description: 'Nothing left to change re: consistency with the surrounding code, and whether a new idea earns itself'
      position:
        type: string
        description: Where this voice stands, in a sentence
      concerns:
        type: string
        description: What to change, one per line
  - name: blast_radius
    description: what else depends on this, and what happens on the way to deploying it
    type: agent
    prompt: |-
      You have watched a two-line change take down a service because of what depended on it. You read a diff by asking who else is standing on the part being moved.

      Your focus: what else depends on this, and what happens on the way to deploying it

      You are one voice among several, each watching for something different. Assess the material below from your standpoint alone. Do not try to cover what the others are watching for, and do not soften a real objection because you assume someone else will raise it.

      Put what you would change in `concerns`, one concrete item per line, each naming the change rather than what is wrong. Leave it empty only if you would change nothing.

      `satisfied` is not about the material. It asks whether the record of this discussion is now complete from where you stand: set it true when the previous round's report states your position and your concerns fairly — including any disagreement you still hold, which being recorded is what settles it — and you have nothing to add. Set it false if the report missed something, got your position wrong, or if another voice raised something you now want to answer.

      If no previous report is shown below, you have not seen one: `satisfied` is false. Say what you think anyway — that is what the first report is built from.

      {% if workflow.input.charge %}--- what this council has been asked to do ---
      {{ workflow.input.charge }}

      {% endif %}{% if workflow.input.intent %}What this is meant to do:
      {{ workflow.input.intent }}

      {% endif %}--- the material ---
      {{ workflow.input.subject }}

      {% if report is defined %}--- where the last round got to ---
      {{ report.output.text }}

      Respond to it. Say plainly if it changed your mind, and say plainly if it did not — agreeing to close a discussion you still disagree with is the one thing that makes this whole exercise worthless.
      {% endif %}
      {% if interject is defined and interject.output.additional_input is defined and interject.output.additional_input.notes is defined %}--- direction from the person overseeing this ---
      {{ interject.output.additional_input.notes }}

      This is not a vote you can outweigh. Take it as a constraint.
      {% endif %}
    tools: []
    input:
      - workflow.input.subject
      - workflow.input.charge?
      - workflow.input.intent?
      - report.output.text?
      - interject.output.additional_input.notes?
    output:
      satisfied:
        type: boolean
        description: 'Nothing left to change re: what else depends on this, and what happens on the way to deploying it'
      position:
        type: string
        description: Where this voice stands, in a sentence
      concerns:
        type: string
        description: What to change, one per line
  - name: report
    description: Synthesise the round
    type: agent
    prompt: |
      Several voices have just assessed the same material, each watching for something different. Write one report of where this round got to.

      Do not average them. Where they disagree, say who disagrees with whom and about what — a disagreement recorded as a disagreement is useful, and one smoothed into consensus is a decision made by omission. Where a concern from one voice would be answered by another's suggestion, say so.

      Put anything still contested in `dissent`, naming the voices. Leave it empty only when nothing is.

      Where a voice objects on grounds another voice's suggestion would fix, say so explicitly — that pairing is usually the actual finding.

      --- correctness (whether this is correct, including the inputs nobody wrote a test for) ---
      position: {{ voices.outputs.correctness.position }}
      concerns:
      {{ voices.outputs.correctness.concerns }}

      --- performance (allocation, IO in loops, and work that grows faster than the input) ---
      position: {{ voices.outputs.performance.position }}
      concerns:
      {{ voices.outputs.performance.concerns }}

      --- patterns (consistency with the surrounding code, and whether a new idea earns itself) ---
      position: {{ voices.outputs.patterns.position }}
      concerns:
      {{ voices.outputs.patterns.concerns }}

      --- blast_radius (what else depends on this, and what happens on the way to deploying it) ---
      position: {{ voices.outputs.blast_radius.position }}
      concerns:
      {{ voices.outputs.blast_radius.concerns }}
    input:
      - voices.outputs.correctness.position
      - voices.outputs.correctness.concerns
      - voices.outputs.correctness.satisfied
      - voices.outputs.performance.position
      - voices.outputs.performance.concerns
      - voices.outputs.performance.satisfied
      - voices.outputs.patterns.position
      - voices.outputs.patterns.concerns
      - voices.outputs.patterns.satisfied
      - voices.outputs.blast_radius.position
      - voices.outputs.blast_radius.concerns
      - voices.outputs.blast_radius.satisfied
      - round_number.output
    output:
      text:
        type: string
        description: The round's report
      dissent:
        type: string
        description: What is still contested, and by whom
    routes:
      - to: interject
  - name: agreed
    type: terminate
    status: success
    reason: Every voice is satisfied
    output_template:
      outcome: agreed
      report: '{{ report.output.text }}'
      dissent: '{{ report.output.dissent }}'
      rounds: '{{ round_number.output }}'
    input:
      - report.output.text
      - report.output.dissent
      - round_number.output
  - name: unresolved
    type: terminate
    status: success
    reason: Still contested after 3 round(s)
    output_template:
      outcome: unresolved
      report: '{{ report.output.text }}'
      dissent: '{{ report.output.dissent }}'
      rounds: '{{ round_number.output }}'
    input:
      - report.output.text
      - report.output.dissent
      - round_number.output
  - name: interject
    description: Read this round and steer it
    type: human_gate
    prompt: |-
      Round {{ round_number.output }} of the council.

      {{ report.output.text }}

      --- still contested ---
      {{ report.output.dissent }}
    input:
      - report.output.text
      - report.output.dissent
      - round_number.output
    options:
      - label: Let them carry on
        value: continue
        route: tallied
      - label: Carry on — with direction
        value: steer
        route: tallied
        prompt_for: notes
        multiline: true
      - label: Stop here and take this report
        value: stop
        route: halted
  - name: halted
    type: terminate
    status: success
    reason: Stopped by the person overseeing the council
    output_template:
      outcome: halted
      report: '{{ report.output.text }}'
      dissent: '{{ report.output.dissent }}'
      rounds: '{{ round_number.output }}'
    input:
      - report.output.text
      - report.output.dissent
      - round_number.output
  - name: tallied
    description: Carry on; check where the council stands
    type: set
    value: continuing
    output_type: string
    input:
      - interject.output.selected
      - round_number.output
      - voices.outputs.correctness.satisfied
      - voices.outputs.performance.satisfied
      - voices.outputs.patterns.satisfied
      - voices.outputs.blast_radius.satisfied
    routes:
      - to: agreed
        when: '{{ voices.outputs.correctness.satisfied and voices.outputs.performance.satisfied and voices.outputs.patterns.satisfied and voices.outputs.blast_radius.satisfied }}'
      - to: unresolved
        when: '{{ round_number.output | int >= 3 }}'
      - to: round_number
parallel:
  - name: voices
    agents:
      - correctness
      - performance
      - patterns
      - blast_radius
    failure_mode: fail_fast
    description: 4 voices, at once
    routes:
      - to: report
