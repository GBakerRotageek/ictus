workflow:
  name: code-council-run
  description: Assess a change from four standpoints and report
  version: '1'
  entry_point: confirm_start
  runtime:
    provider:
      name: claude-agent-sdk
    default_model: claude-opus-5
    checkpoint:
      every_agent: true
  input:
    target:
      type: string
      required: true
      description: What to assess — a git ref, a path, or a diff
    charge:
      type: string
      required: false
      description: Standing instruction for every voice, e.g. 'we ship this Friday'
  context:
    mode: explicit
  limits:
    max_iterations: 8
agents:
  - name: pull
    description: Fetch the change and read enough around it to judge it
    type: agent
    prompt: |-
      Fetch the change described below and read enough of the surrounding code to judge it. Return the change itself in `diff`, and in `context` whatever a reader would need that is not in the diff — what calls this, what it used to do, which tests cover it.

      {{ workflow.input.target }}
    input:
      - workflow.input.target
    output:
      diff:
        type: string
        description: The change
      context:
        type: string
        description: What surrounds it
    routes:
      - to: purpose
  - name: purpose
    description: Work out what the change is meant to achieve
    type: agent
    prompt: |-
      State what this change is meant to achieve, in a few sentences. Judge it later against this, not against taste — a change that does something different from what it set out to do is the finding, and you cannot see that without writing down the intent first.

      --- change ---
      {{ pull.output.diff }}

      --- context ---
      {{ pull.output.context }}
    input:
      - pull.output.diff
      - pull.output.context
    output:
      intent:
        type: string
        description: What this is for
    routes:
      - to: council
  - name: council
    description: Four standpoints on one change
    type: workflow
    workflow: ./code-council.yaml
    input:
      - workflow.input.charge?
      - pull.output.diff
      - purpose.output.intent?
    input_mapping:
      charge: '{{ workflow.input.charge }}'
      subject: '{{ pull.output.diff }}'
      intent: '{% if purpose is defined %}{{ purpose.output.intent }}{% else %}{% endif %}'
    routes:
      - to: write_report
        when: "{{ council.output.outcome == 'agreed' }}"
      - to: contested
        when: "{{ council.output.outcome == 'unresolved' }}"
      - to: contested
        when: "{{ council.output.outcome == 'halted' }}"
  - name: write_report
    description: Write the council's report into the project
    type: script
    command: sh
    args:
      - -c
      - mkdir -p "$(dirname "$1")" && cat > "$1" && printf '{"path":"%s"}' "$(printf %s "$1" | sed 's/\\/\\\\/g;s/"/\\"/g')"
      - sh
      - council-review.md
    stdin: '{{ council.output.report }}'
    input:
      - council.output.report
    output:
      path:
        type: string
        description: The file that was written
    routes:
      - to: reported
  - name: reported
    type: terminate
    status: success
    reason: The council agreed
    output_template:
      report: '{{ write_report.output.path }}'
      rounds: '{{ council.output.rounds }}'
    input:
      - write_report.output.path
      - council.output.rounds
  - name: contested
    type: terminate
    status: success
    reason: The council did not converge; a person should read the disagreement
    output_template:
      report: '{{ council.output.report }}'
      dissent: '{{ council.output.dissent }}'
    input:
      - council.output.report
      - council.output.dissent
  - name: confirm_start
    description: Confirm before anything runs
    type: human_gate
    prompt: |-
      Start **code-council-run**?

      Assess a change from four standpoints and report

      6 step(s), beginning with `pull`.

      ---

      **target**

      ```
      {{ workflow.input.target }}
      ```
      {% if workflow.input.charge %}
      **charge**

      ```
      {{ workflow.input.charge }}
      ```
      {% endif %}
    input:
      - workflow.input.target
      - workflow.input.charge?
    options:
      - label: Start the run
        value: start
        route: pull
      - label: Stop — do not run
        value: cancel
        route: not_started
  - name: not_started
    type: terminate
    status: success
    reason: Stopped at the start gate; nothing was run.
    output_template:
      started: 'false'
