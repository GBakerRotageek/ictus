workflow:
  name: provision
  description: Reset a database, then gate going live on a human.
  version: '1'
  entry_point: confirm_start
  runtime:
    provider:
      name: claude-agent-sdk
    mcp_servers:
      github:
        type: http
        url: https://api.githubcopilot.com/mcp/
        headers:
          Authorization: Bearer ${GITHUB_TOKEN:-}
      filesystem:
        type: stdio
        command: npx
        args:
          - -y
          - '@modelcontextprotocol/server-filesystem'
          - .
    checkpoint:
      every_agent: true
  input:
    environment:
      type: string
      required: true
      description: Environment to provision
  context:
    mode: explicit
  limits:
    max_iterations: 11
  metadata:
    generator: ictus
    pipeline: provision
agents:
  - name: check_connections
    description: Confirm every MCP server answers before touching a database
    type: workflow
    workflow: ./check-connections.yaml
    routes:
      - to: reset
  - name: reset
    description: Reset the database
    type: workflow
    workflow: ./reset-db.yaml
    input:
      - workflow.input.environment
    input_mapping:
      environment: '{{ workflow.input.environment }}'
    routes:
      - to: confirm
  - name: confirm
    description: Confirm before going live
    type: workflow
    workflow: ./confirm-reset.yaml
    input:
      - reset.output.result
    input_mapping:
      data: '{{ reset.output.result }}'
    routes:
      - to: live
        when: "{{ confirm.output.decision == 'approved' }}"
      - to: reset
        when: "{{ confirm.output.decision == 'redo' }}"
      - to: aborted
  - name: live
    type: terminate
    status: success
    reason: Reset confirmed; environment is live.
  - name: aborted
    type: terminate
    status: success
    reason: Operator declined the reset.
  - name: confirm_start
    description: Confirm before anything runs
    type: human_gate
    prompt: |
      Start **provision**?

      Reset a database, then gate going live on a human.

      5 step(s) on one pass, up to 9 with loops, beginning with `check_connections`.

      ---

      **environment**

      ```
      {{ workflow.input.environment }}
      ```
    input:
      - workflow.input.environment
    options:
      - label: Start the run
        value: start
        route: check_connections
      - label: Stop — do not run
        value: cancel
        route: not_started
  - name: not_started
    type: terminate
    status: success
    reason: Stopped at the start gate; nothing was run.
    output_template:
      started: 'false'
output:
  review_notes: '{{ confirm.output.notes | tojson }}'
