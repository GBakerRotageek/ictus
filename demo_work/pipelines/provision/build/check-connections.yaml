      Send independent lookups together. Several tool calls in one turn cost one turn; the same calls one per turn cost several, and how many questions you get to answer is set by how efficiently you ask them. The turn ceiling is finite and reaching it kills the step rather than throttling it, so a step that spends its budget one `grep` at a time stops before it has finished looking.

      Prefer the specific. Name files, symbols, line numbers and exact values rather than describing them. Quote what you found.

      You will not be asked a follow-up question. Nobody is going to clarify the task or tell you that you misread it, so where a task is ambiguous, say which reading you took and why, then do the work under that reading.
    dialog:
      trigger_prompt: Always enter dialog. The workflow is paused on a failure that needs a person, and this agent exists to work through it with them.
    input:
      - verdict.output.report
    output:
      resolved:
        type: boolean
        description: Whether the helper believes it is fixed
      summary:
        type: string
        description: What was done, and what is still needed
    routes:
      - to: checks
        when: '{{ assist.output.resolved }}'
      - to: unblock
  - name: ready
    type: terminate
    status: success
    reason: Every declared MCP server responded.
  - name: aborted
    type: terminate
    status: success
    reason: 'Aborted by the operator: a required MCP server was unreachable.'
parallel:
  - name: checks
    agents:
      - check_github
      - check_filesystem
    failure_mode: continue_on_error
    description: Probe every declared server at once
    routes:
      - to: verdict
output:
  report: '{{ verdict.output.report | tojson }}'
