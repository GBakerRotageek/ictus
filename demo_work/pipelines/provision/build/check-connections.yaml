      Prefer the specific. Name files, symbols, line numbers and exact values rather than describing them. Quote what you found.

      You will not be asked a follow-up question. Nobody is going to clarify the task or tell you that you misread it, so where a task is ambiguous, say which reading you took and why, then do the work under that reading.
    input:
      - checks.outputs.check_github.available?
      - checks.outputs.check_github.detail?
      - checks.outputs.check_filesystem.available?
      - checks.outputs.check_filesystem.detail?
    output:
      all_ok:
        type: boolean
        description: Whether every server answered
      report:
        type: string
        description: What was found, per server
    routes:
      - to: ready
        when: '{{ verdict.output.all_ok }}'
      - to: unblock
  - name: unblock
    description: A server is unreachable
    type: human_gate
    prompt: |-
      One or more MCP servers a later step depends on are not answering.

      {{ verdict.output.report }}{% if assist is defined %}

      An earlier attempt to resolve this reported:
      {{ assist.output.summary }}{% endif %}

      Choose 'Help me fix it' to work through it with an assistant, or fix it yourself and choose to check again. If it cannot be fixed from here, abort rather than looping.
    input:
      - verdict.output.report
      - assist.output.summary?
    options:
      - label: Help me fix it
        value: assist
        route: assist
      - label: I have fixed it — check again
        value: retry
        route: checks
      - label: Abort the run
        value: abort
        route: aborted
  - name: assist
    description: Help resolve an MCP server the run depends on
    type: agent
    prompt: |-
      A workflow is paused because an MCP server the run depends on failed. Here is what was observed:

      {{ verdict.output.report }}

      Help the person get past this. Talk to them: explain what is wrong in plain terms, then work through it with them.

      Work in this order:
      1. Diagnose before changing anything. Check what is actually true: is the command present, does the host resolve, is the variable set, what exactly did the failure say.
      2. Fix what you can fix safely — a missing package, a wrong path, a stale config file. Say what you are doing before you do it.
      3. The moment a fix needs a credential or an access change, stop and hand it over with the exact command.
      4. When there is nothing left you can do, say plainly what is still needed and who has to do it.

      Hard rules you must not break:
      - Never ask the person to paste a token, key, password or any other secret into this conversation. If a fix needs one, give them the exact command to run in their own shell and let them run it there.
      - Never print the value of an environment variable or any credential, even if you can read it. Say whether it is set, never what it is.
      - Anything that changes access, permissions or credentials is theirs to run, not yours. Hand over the command and say what it will do.

      When you are done, report whether the run can proceed. It will be re-checked automatically, so do not claim success you have not verified.
    system_prompt: |-
      You are one step in an automated workflow. Your output is read by later steps and by a person who was not watching you work, so it has to stand on its own.

      Check before you assert. If you say that something behaves a particular way, is missing, or cannot be done, you must have looked at the thing itself — the source, the schema, the file — and not at a summary, a README, or your own recollection. You have tools; a claim you could have checked in a minute and did not is not worth making.

