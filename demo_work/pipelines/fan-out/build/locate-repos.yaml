workflow:
  name: locate-repos
  description: Work out which repositories a ticket touches
  version: '1'
  entry_point: search
  runtime:
    provider:
      name: claude-agent-sdk
  input:
    ticket:
      type: string
      required: true
      description: The ticket body
  context:
    mode: explicit
  limits:
    max_iterations: 4
agents:
  - name: search
    description: Identify the repositories involved
    type: agent
    prompt: |-
      Read this ticket and split it into one piece of work per repository it touches. If exactly one repository is implied, that is one piece. If it is unclear which repositories are meant, set verdict to 'ambiguous' and list what you considered. If none can be identified, set verdict to 'missing'.

      {{ workflow.input.ticket }}
    input:
      - workflow.input.ticket
    output:
      pieces:
        type: array
        description: One entry per repository
        items:
          type: object
          properties:
            repo:
              type: string
            task:
              type: string
            acceptance:
              type: string
      considered:
        type: array
        description: Repositories weighed but not chosen
      verdict:
        type: string
        description: found, ambiguous or missing
    routes:
      - to: ambiguous
        when: "{{ search.output.verdict == 'ambiguous' }}"
      - to: missing
        when: "{{ search.output.verdict == 'missing' }}"
      - to: found
  - name: found
    type: terminate
    status: success
    reason: Identified the repositories
    output_template:
      outcome: found
      pieces: '{{ search.output.pieces | tojson }}'
      candidates: '[]'
    input:
      - search.output.pieces
  - name: ambiguous
    type: terminate
    status: success
    reason: More than one reading of the ticket
    output_template:
      outcome: ambiguous
      pieces: '[]'
      candidates: '{{ search.output.considered | tojson }}'
    input:
      - search.output.considered
  - name: missing
    type: terminate
    status: success
    reason: No repository could be identified
    output_template:
      outcome: missing
      pieces: '[]'
      candidates: '[]'
