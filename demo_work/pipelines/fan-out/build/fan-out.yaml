workflow:
  name: fan-out
  description: Split a ticket across repositories and work each one
  version: '1'
  entry_point: confirm_start
  runtime:
    provider:
      name: claude-agent-sdk
    checkpoint:
      every_agent: true
  input:
    brief:
      type: string
      required: true
      description: The ticket to act on
  context:
    mode: explicit
  limits:
    max_iterations: 13
agents:
  - name: locate
    description: Work out which repositories a ticket touches
    type: workflow
    workflow: ./locate-repos.yaml
    input:
      - workflow.input.brief
    input_mapping:
      ticket: '{{ workflow.input.brief }}'
    routes:
      - to: workers
        when: "{{ locate.output.outcome == 'found' }}"
      - to: unclear
        when: "{{ locate.output.outcome == 'ambiguous' }}"
      - to: unclear
        when: "{{ locate.output.outcome == 'missing' }}"
  - name: planned
    type: terminate
    status: success
    reason: Every repository has a plan
    output_template:
      plans: '{{ workers.outputs | tojson }}'
      repos: '{{ workers.count }}'
    input:
      - workers.outputs
  - name: unclear
    type: terminate
    status: success
    reason: A person has to say which repositories this ticket means
    output_template:
      candidates: '{{ locate.output.candidates | tojson }}'
    input:
      - locate.output.candidates
  - name: confirm_start
    description: Confirm before anything runs
    type: human_gate
    prompt: |
      Start **fan-out**?

      Split a ticket across repositories and work each one

      11 step(s), beginning with `locate`.

      ---

      **brief**

      ```
      {{ workflow.input.brief }}
      ```
    input:
      - workflow.input.brief
    options:
      - label: Start the run
        value: start
        route: locate
      - label: Stop — do not run
        value: cancel
        route: not_started
  - name: not_started
    type: terminate
    status: success
    reason: Stopped at the start gate; nothing was run.
    output_template:
      started: 'false'
for_each:
  - name: workers
    type: for_each
    source: locate.output.pieces
    as: piece
    agent:
      name: worker
      description: Plan one repository's share of the ticket
      type: agent
      prompt: |-
        Repository: {{ piece.repo }}
        Work: {{ piece.task }}
        Done when: {{ piece.acceptance }}

        Write the plan for this repository alone. Do not touch the others.
      output:
        plan:
          type: string
          description: What to do in this repository
        risk:
          type: string
          description: What could go wrong
    max_concurrent: 4
    description: One planner per repository
    key_by: piece.repo
    routes:
      - to: planned
output:
  plans: '{{ workers.outputs | tojson }}'
