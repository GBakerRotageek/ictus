      - workflow.input.charge?
      - workflow.input.intent?
      - voices.outputs.capability.position?
      - voices.outputs.capability.concerns?
      - voices.outputs.experience.position?
      - voices.outputs.experience.concerns?
      - voices.outputs.authoring.position?
      - voices.outputs.authoring.concerns?
      - report.output.text?
      - verify.output.corrections?
      - interject.output.additional_input.notes?
    output:
      satisfied:
        type: boolean
        description: 'Nothing left to change re: which agent capabilities a node should be able to opt into, and what it costs to leave them switched on by default'
      position:
        type: string
        description: Where this voice stands, in a sentence
      concerns:
        type: string
        description: What to change, one per line
      unchecked:
        type: string
        description: What this voice could not verify, and what blocked it
  - name: report
    description: Synthesise the round
    type: agent
    prompt: |
      Several voices have just assessed the same material, each watching for something different. Write one report of where this round got to.

      Do not average them. Where they disagree, say who disagrees with whom and about what — a disagreement recorded as a disagreement is useful, and one smoothed into consensus is a decision made by omission. Where a concern from one voice would be answered by another's suggestion, say so.

      Put anything still contested in `dissent`, naming the voices. Leave it empty only when nothing is.

      Each voice also reports what it could not check. Collect all of it into `unverified`, naming the voice and what blocked it. This is the one part of the report you must not tidy away: a finding that rests on a lookup nobody managed to perform is not a finding, and it must be visible as such rather than written up in the same voice as a checked one. Where a voice put a claim in `concerns` that its own `unchecked` shows it could not verify, say so in `unverified` rather than repeating the claim.

      Voices agreeing is not evidence. Several voices blocked by the same failed lookup will reach the same wrong conclusion independently and look like consensus; if their `unchecked` entries name the same obstacle, say that plainly — it is the most useful thing in the round.

      Group what you find by what it would take to close it: a prompt, a new constructor, a change to the engine boundary, or a decision nobody has made yet. A need that cannot be sized is a need nobody will pick up.

      --- capability (what a pipeline needs to express that this library cannot) ---
      position: {{ voices.outputs.capability.position }}
      concerns:
      {{ voices.outputs.capability.concerns }}
      could not check:
      {{ voices.outputs.capability.unchecked }}

      --- experience (the person launching a run, watching it, and answering it mid-flight) ---
      position: {{ voices.outputs.experience.position }}
      concerns:
      {{ voices.outputs.experience.concerns }}
      could not check:
      {{ voices.outputs.experience.unchecked }}

      --- authoring (what a developer must learn, decide and get right to author a new pipeline) ---
      position: {{ voices.outputs.authoring.position }}
      concerns:
      {{ voices.outputs.authoring.concerns }}
      could not check:
      {{ voices.outputs.authoring.unchecked }}

      --- agent_power (which agent capabilities a node should be able to opt into, and what it costs to leave them switched on by default) ---
      position: {{ voices.outputs.agent_power.position }}
      concerns:
      {{ voices.outputs.agent_power.concerns }}
      could not check:
      {{ voices.outputs.agent_power.unchecked }}
    system_prompt: |-
      You are one step in an automated workflow. Your output is read by later steps and by a person who was not watching you work, so it has to stand on its own.

      Check before you assert. If you say that something behaves a particular way, is missing, or cannot be done, you must have looked at the thing itself — the source, the schema, the file — and not at a summary, a README, or your own recollection. You have tools; a claim you could have checked in a minute and did not is not worth making.

      Check the case you are actually claiming. A description covering one case is not evidence about a different one, so a claim that two things differ has to be checked in both. Where the question is what something *does* rather than what it accepts, read the code that runs, not the comment above it. Before reporting something as missing, look for where it would already be handled — a thing that turns out to be wired is a different and much cheaper finding.

      A tool that errors tells you about this environment, not about the thing you were reaching for. `command not found`, a missing module and an empty result mean you asked the wrong path, the wrong interpreter or the wrong question; none of them mean the thing does not exist. Try another route, and if you still cannot get there, report that you could not rather than what you would have found.

      Say what you did not check. An answer that names its own gaps is more useful than one that reads as complete and is not, because the next step will build on whatever you hand it. Being confidently wrong costs more here than in a conversation, where somebody would have corrected you.

      Send independent lookups together. Several tool calls in one turn cost one turn; the same calls one per turn cost several, and how many questions you get to answer is set by how efficiently you ask them. The turn ceiling is finite and reaching it kills the step rather than throttling it, so a step that spends its budget one `grep` at a time stops before it has finished looking.

      Prefer the specific. Name files, symbols, line numbers and exact values rather than describing them. Quote what you found.

      You will not be asked a follow-up question. Nobody is going to clarify the task or tell you that you misread it, so where a task is ambiguous, say which reading you took and why, then do the work under that reading.
    input:
      - voices.outputs.capability.position
      - voices.outputs.capability.concerns
      - voices.outputs.capability.unchecked
      - voices.outputs.capability.satisfied
      - voices.outputs.experience.position
      - voices.outputs.experience.concerns
      - voices.outputs.experience.unchecked
      - voices.outputs.experience.satisfied
      - voices.outputs.authoring.position
      - voices.outputs.authoring.concerns
      - voices.outputs.authoring.unchecked
      - voices.outputs.authoring.satisfied
      - voices.outputs.agent_power.position
      - voices.outputs.agent_power.concerns
      - voices.outputs.agent_power.unchecked
      - voices.outputs.agent_power.satisfied
      - round_number.output
    output:
      text:
        type: string
        description: The round's report
      dissent:
        type: string
        description: What is still contested, and by whom
      unverified:
        type: string
        description: Claims resting on something nobody could check
    routes:
      - to: verify
  - name: verify
    description: Check the report against the thing itself
    type: agent
    prompt: |-
      This project compiles to Conductor workflow YAML, and the installed engine is the ground truth for every claim about what can and cannot be expressed. Read its schema and source before agreeing with anything: `python -c "import conductor, pathlib; print(pathlib.Path(conductor.__file__).parent)"` finds it; `config/schema.py` is the field-by-field contract and `engine/` is what actually runs. A claim that something is impossible, missing, or works a certain way is checkable there in under a minute, and most such claims in a report like this are wrong because nobody looked.

      You are checking a report several people wrote after discussing something. Your job is to refute it, not to improve it. They may have read a summary rather than the thing itself, and agreement between them is no evidence at all — four people who read the same wrong page agree sooner, not later.

      Take every claim about how something behaves and check it against the thing itself. In `corrections`, list what does not survive: quote the claim, say what is actually the case, and cite where you looked. Say plainly when a claim is right — a correction list that strikes out everything is as useless as one that strikes out nothing.

      Set `sound` to true only if nothing material was wrong. A report whose central point rests on a claim you refuted is not sound, however well argued.

      Start with what they could not check. That list is where the unfounded claims are, and a lookup one voice failed at is usually one you can complete — a command run against the wrong path or the wrong interpreter fails in a way that looks identical to the thing being absent. Go and complete it. If several voices were stopped by the same obstacle, treat every conclusion downstream of it as unfounded until you have checked it yourself, however many of them agreed.

      --- the report ---
      {{ report.output.text }}

      --- what they still contest ---
      {{ report.output.dissent }}

      --- what they could not check ---
      {{ report.output.unverified }}
    system_prompt: |-
      You are one step in an automated workflow. Your output is read by later steps and by a person who was not watching you work, so it has to stand on its own.

      Check before you assert. If you say that something behaves a particular way, is missing, or cannot be done, you must have looked at the thing itself — the source, the schema, the file — and not at a summary, a README, or your own recollection. You have tools; a claim you could have checked in a minute and did not is not worth making.

      Check the case you are actually claiming. A description covering one case is not evidence about a different one, so a claim that two things differ has to be checked in both. Where the question is what something *does* rather than what it accepts, read the code that runs, not the comment above it. Before reporting something as missing, look for where it would already be handled — a thing that turns out to be wired is a different and much cheaper finding.

      A tool that errors tells you about this environment, not about the thing you were reaching for. `command not found`, a missing module and an empty result mean you asked the wrong path, the wrong interpreter or the wrong question; none of them mean the thing does not exist. Try another route, and if you still cannot get there, report that you could not rather than what you would have found.

      Say what you did not check. An answer that names its own gaps is more useful than one that reads as complete and is not, because the next step will build on whatever you hand it. Being confidently wrong costs more here than in a conversation, where somebody would have corrected you.

      Send independent lookups together. Several tool calls in one turn cost one turn; the same calls one per turn cost several, and how many questions you get to answer is set by how efficiently you ask them. The turn ceiling is finite and reaching it kills the step rather than throttling it, so a step that spends its budget one `grep` at a time stops before it has finished looking.

      Prefer the specific. Name files, symbols, line numbers and exact values rather than describing them. Quote what you found.

      You will not be asked a follow-up question. Nobody is going to clarify the task or tell you that you misread it, so where a task is ambiguous, say which reading you took and why, then do the work under that reading.
    max_agent_iterations: 200
    session_key: needs-review-verify
    input:
      - report.output.text
      - report.output.dissent
      - report.output.unverified
    output:
      corrections:
        type: string
        description: Claims that did not survive
      sound:
        type: boolean
        description: Whether it holds up
    routes:
      - to: interject
  - name: agreed
    type: terminate
    status: success
    reason: Every voice is satisfied
    output_template:
      outcome: agreed
      report: '{{ report.output.text }}'
      dissent: '{{ report.output.dissent }}'
      unverified: '{{ report.output.unverified }}'
      rounds: '{{ round_number.output }}'
      corrections: '{{ verify.output.corrections }}'
    input:
      - report.output.text
      - report.output.dissent
      - report.output.unverified
      - round_number.output
      - verify.output.corrections
  - name: unresolved
    type: terminate
    status: success
    reason: Still contested after 3 round(s)
    output_template:
      outcome: unresolved
      report: '{{ report.output.text }}'
      dissent: '{{ report.output.dissent }}'
      unverified: '{{ report.output.unverified }}'
      rounds: '{{ round_number.output }}'
      corrections: '{{ verify.output.corrections }}'
    input:
      - report.output.text
      - report.output.dissent
      - report.output.unverified
      - round_number.output
      - verify.output.corrections
  - name: interject
    description: Read this round and steer it
    type: human_gate
    prompt: |-
      Round {{ round_number.output }} of 3.

      **Where it stands**

      - `capability` satisfied: {{ voices.outputs.capability.satisfied }}
      - `experience` satisfied: {{ voices.outputs.experience.satisfied }}
      - `authoring` satisfied: {{ voices.outputs.authoring.satisfied }}
      - `agent_power` satisfied: {{ voices.outputs.agent_power.satisfied }}
      - report survived checking: {{ verify.output.sound }}

      Choosing to carry on hands it back to the council, which then finishes if every voice is satisfied and the report survived checking, or runs another round — up to 3.

      {{ report.output.text }}

      --- still contested ---
      {{ report.output.dissent }}

      --- what did not survive checking ---
      {{ verify.output.corrections }}
    input:
      - verify.output.corrections
      - report.output.text
      - report.output.dissent
      - round_number.output
      - voices.outputs.capability.satisfied
      - voices.outputs.experience.satisfied
      - voices.outputs.authoring.satisfied
      - voices.outputs.agent_power.satisfied
      - verify.output.sound
    options:
      - label: Hand it back to the council
        value: continue
        route: tallied
      - label: Hand it back, with direction they must follow
        value: steer
        route: tallied
        prompt_for: notes
        multiline: true
      - label: Stop now and take this report as it is
        value: stop
        route: halted
  - name: halted
    type: terminate
    status: success
    reason: Stopped by the person overseeing the council
    output_template:
      outcome: halted
      report: '{{ report.output.text }}'
      dissent: '{{ report.output.dissent }}'
      unverified: '{{ report.output.unverified }}'
      rounds: '{{ round_number.output }}'
      corrections: '{{ verify.output.corrections }}'
    input:
      - report.output.text
      - report.output.dissent
      - report.output.unverified
      - round_number.output
      - verify.output.corrections
  - name: tallied
    description: Decide whether the council is finished
    type: set
    value: continuing
    output_type: string
    input:
      - interject.output.selected
      - round_number.output
      - voices.outputs.capability.satisfied
      - voices.outputs.experience.satisfied
      - voices.outputs.authoring.satisfied
      - voices.outputs.agent_power.satisfied
      - verify.output.sound
    routes:
      - to: agreed
        when: '{{ voices.outputs.capability.satisfied and voices.outputs.experience.satisfied and voices.outputs.authoring.satisfied and voices.outputs.agent_power.satisfied and verify.output.sound }}'
      - to: unresolved
        when: '{{ round_number.output | int >= 3 }}'
      - to: round_number
parallel:
  - name: voices
    agents:
      - capability
      - experience
      - authoring
      - agent_power
    failure_mode: fail_fast
    description: 4 voices, at once
    routes:
      - to: report
