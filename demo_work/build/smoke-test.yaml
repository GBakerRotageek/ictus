workflow:
  name: smoke-test
  description: Plan a ticket, break it down, gate it on a human, execute and test.
  version: '1'
  entry_point: locate
  runtime:
    provider:
      name: claude-agent-sdk
    mcp_servers:
      github:
        type: http
        url: https://api.githubcopilot.com/mcp/
        headers:
          Authorization: Bearer ${GITHUB_TOKEN:-}
    checkpoint:
      every_agent: true
  input:
    ticket:
      type: string
      required: true
      description: The ticket to work
  context:
    mode: explicit
  limits:
    max_iterations: 11
    budget_usd: 5.0
    budget_mode: enforce
  metadata:
    generator: ictus
    pipeline: smoke-test
agents:
  - name: locate
    description: Locate the work
    type: workflow
    workflow: ./locate-work.yaml
    input:
      - workflow.input.ticket
    input_mapping:
      brief: '{{ workflow.input.ticket }}'
    routes:
      - to: plan
  - name: plan
    description: Turn the raw ticket into a stated goal and constraints
    type: agent
    prompt: |-
      Read this ticket and restate it as a goal with explicit constraints and acceptance criteria.

      {{ workflow.input.ticket }}

      What was already known about where the work lives:
      {{ locate.output.known }}

      What a person supplied when it could not be determined:
      {{ locate.output.answers }}
    input:
      - workflow.input.ticket
      - locate.output.known
      - locate.output.answers
    output:
      plan:
        type: string
        description: Goal, constraints, acceptance criteria
    routes:
      - to: breakdown
  - name: breakdown
    description: Decompose the plan into ordered steps
    type: agent
    prompt: |-
      Break this plan into ordered, individually verifiable steps.

      {{ plan.output.plan }}

      {% if review_gate is defined %}A previous breakdown was rejected with these notes — address them:
      {{ review_gate.output.additional_input.notes }}{% endif %}
    input:
      - plan.output.plan
      - review_gate.output.additional_input.notes?
    output:
      steps:
        type: array
        description: Ordered steps
    routes:
      - to: review_gate
  - name: review_gate
    description: Human review of the breakdown
    type: human_gate
    prompt: |-
      Approve this breakdown?

      {{ breakdown.output.steps }}
    input:
      - breakdown.output.steps
    options:
      - label: Approve
        value: approved
        route: execution
      - label: Reject and revise
        value: rejected
        route: breakdown
        prompt_for: notes
        multiline: true
  - name: execution
    description: Carry out the approved steps
    type: agent
    prompt: |-
      Carry out these approved steps, one at a time.

      {{ breakdown.output.steps }}
    input:
      - breakdown.output.steps
    output:
      results:
        type: object
        description: What each step produced
    routes:
      - to: testing
  - name: testing
    description: Verify the results against the acceptance criteria
    type: agent
    prompt: |-
      Check these results against the acceptance criteria and report what passed and what did not.

      Criteria:
      {{ plan.output.plan }}

      Results:
      {{ execution.output.results }}
    input:
      - plan.output.plan
      - execution.output.results
    output:
      report:
        type: string
        description: Pass/fail report
    routes:
      - to: finish
  - name: finish
    description: Ticket complete
    type: terminate
    status: success
    reason: Breakdown approved, executed and tested.
    output_template:
      report: '{{ testing.output.report }}'
    input:
      - testing.output.report
output:
  report: '{{ testing.output.report }}'
