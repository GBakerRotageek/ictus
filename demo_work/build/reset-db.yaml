workflow:
  name: reset-db
  description: Drop, migrate and seed a database
  version: '1'
  entry_point: drop
  runtime:
    provider:
      name: copilot
  input:
    environment:
      type: string
      required: true
      description: Value passed to every command as environment
  context:
    mode: explicit
  limits:
    max_iterations: 3
agents:
  - name: drop
    description: Drop the schema
    type: script
    command: ./db.sh
    args:
      - drop
      - '{{ workflow.input.environment }}'
    working_dir: demo_work/scripts
    input:
      - workflow.input.environment
    output:
      dropped:
        type: string
        description: Output of drop
    routes:
      - to: migrate
  - name: migrate
    description: Apply migrations
    type: script
    command: ./db.sh
    args:
      - migrate
      - '{{ workflow.input.environment }}'
    working_dir: demo_work/scripts
    input:
      - drop.output.dropped
    output:
      revision:
        type: string
        description: Output of migrate
    routes:
      - to: seed
  - name: seed
    description: Load seed data
    type: script
    command: ./db.sh
    args:
      - seed
      - '{{ workflow.input.environment }}'
    working_dir: demo_work/scripts
    input:
      - migrate.output.revision
    output:
      status:
        type: string
        description: Output of seed
    routes:
      - to: $end
output:
  result: '{{ seed.output.status }}'
