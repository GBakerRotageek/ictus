workflow:
  name: check-connections
  description: Confirm every MCP server answers before touching a database
  version: '1'
  entry_point: checks
  runtime:
    provider:
      name: copilot
    checkpoint:
      every_agent: true
  context:
    mode: explicit
  limits:
    max_iterations: 15
agents:
  - name: check_github
    description: Check the github MCP server responds
    type: agent
    prompt: |-
      An MCP server named 'github' should be available to you.
      It is needed so that: Read the change set being provisioned and comment on its PR

      Call exactly one inexpensive, read-only tool from 'github' to confirm it is connected and answering. Do not call tools from any other server, and do not create, modify or delete anything.

      Report available=true only if a tool from that server actually returned a result. If no tool from it is offered to you, or the call failed, report available=false and say in `detail` exactly which tool you tried and what happened. Do not guess, and do not report success because the server is mentioned in this prompt.
    output:
      available:
        type: boolean
        description: Whether github answered
      detail:
        type: string
        description: Which tool was tried, and the result
  - name: check_filesystem
    description: Check the filesystem MCP server responds
    type: agent
    prompt: |-
      An MCP server named 'filesystem' should be available to you.
      It is needed so that: Read migration files and seed data from the workspace

      Call exactly one inexpensive, read-only tool from 'filesystem' to confirm it is connected and answering. Do not call tools from any other server, and do not create, modify or delete anything.

      Report available=true only if a tool from that server actually returned a result. If no tool from it is offered to you, or the call failed, report available=false and say in `detail` exactly which tool you tried and what happened. Do not guess, and do not report success because the server is mentioned in this prompt.
    output:
      available:
        type: boolean
        description: Whether filesystem answered
      detail:
        type: string
        description: Which tool was tried, and the result
  - name: verdict
    description: Decide whether every server is usable
    type: agent
    prompt: |+
      Each block below is one MCP server check. Report all_ok=true only if every one reported available=true. In `report`, name each server that failed and what it said, so the reader knows what to go and fix.

      --- check_github ---
      available: {{ checks.outputs.check_github.available }}
      detail: {{ checks.outputs.check_github.detail }}

      --- check_filesystem ---
      available: {{ checks.outputs.check_filesystem.available }}
      detail: {{ checks.outputs.check_filesystem.detail }}

    input:
      - checks.outputs.check_github.available
      - checks.outputs.check_github.detail
      - checks.outputs.check_filesystem.available
      - checks.outputs.check_filesystem.detail
    output:
      all_ok:
        type: boolean
        description: Whether every server answered
      report:
        type: string
        description: What was found, per server
    routes:
      - to: ready
        when: '{{ verdict.output.all_ok }}'
      - to: unblock
  - name: unblock
    description: A server is unreachable
    type: human_gate
    prompt: |-
      One or more MCP servers a later step depends on are not answering.

      {{ verdict.output.report }}{% if assist is defined %}

      An earlier attempt to resolve this reported:
      {{ assist.output.summary }}{% endif %}

      Choose 'Help me fix it' to work through it with an assistant, or fix it yourself and choose to check again. If it cannot be fixed from here, abort rather than looping.
    input:
      - verdict.output.report
      - assist.output.summary?
    options:
      - label: Help me fix it
        value: assist
        route: assist
      - label: I have fixed it — check again
        value: retry
        route: checks
      - label: Abort the run
        value: abort
        route: aborted
  - name: assist
    description: Help resolve an MCP server the run depends on
    type: agent
    prompt: |-
      A workflow is paused because an MCP server the run depends on failed. Here is what was observed:

      {{ verdict.output.report }}

      Help the person get past this. Talk to them: explain what is wrong in plain terms, then work through it with them.

      Work in this order:
      1. Diagnose before changing anything. Check what is actually true: is the command present, does the host resolve, is the variable set, what exactly did the failure say.
      2. Fix what you can fix safely — a missing package, a wrong path, a stale config file. Say what you are doing before you do it.
      3. The moment a fix needs a credential or an access change, stop and hand it over with the exact command.
      4. When there is nothing left you can do, say plainly what is still needed and who has to do it.

      Hard rules you must not break:
      - Never ask the person to paste a token, key, password or any other secret into this conversation. If a fix needs one, give them the exact command to run in their own shell and let them run it there.
      - Never print the value of an environment variable or any credential, even if you can read it. Say whether it is set, never what it is.
      - Anything that changes access, permissions or credentials is theirs to run, not yours. Hand over the command and say what it will do.

      When you are done, report whether the run can proceed. It will be re-checked automatically, so do not claim success you have not verified.
    dialog:
      trigger_prompt: Always enter dialog. The workflow is paused on a failure that needs a person, and this agent exists to work through it with them.
    input:
      - verdict.output.report
    output:
      resolved:
        type: boolean
        description: Whether the helper believes it is fixed
      summary:
        type: string
        description: What was done, and what is still needed
    routes:
      - to: checks
        when: '{{ assist.output.resolved }}'
      - to: unblock
  - name: ready
    type: terminate
    status: success
    reason: Every declared MCP server responded.
  - name: aborted
    type: terminate
    status: failed
    reason: 'Aborted: a required MCP server was unreachable.'
parallel:
  - name: checks
    agents:
      - check_github
      - check_filesystem
    failure_mode: continue_on_error
    description: Probe every declared server at once
    routes:
      - to: verdict
output:
  report: '{{ verdict.output.report }}'
